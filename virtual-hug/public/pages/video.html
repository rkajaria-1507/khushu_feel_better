<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Video</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/lock.css">
  <style>
    body { font-family: Poppins, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; background:#000; color:#fff; }
    .video-wrapper { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    video { max-width:100%; max-height:100%; background:#000; }
    .controls { position:fixed; top:12px; left:12px; z-index:9999; }
    .controls button, .controls a { margin-right:8px; padding:8px 12px; background:#fff; color:#111; border-radius:6px; text-decoration:none; border:none; cursor:pointer; }
  </style>
</head>
<body>
  <div class="controls">
    <a href="../index.html">← Back to Home</a>
    <button id="fs-btn">Fullscreen</button>
  </div>
  <div class="video-wrapper">
    <video id="page-video" src="../audio/love-song.mp4" controls playsinline></video>
  </div>
  <script>
    const vid = document.getElementById('page-video');
    const fsBtn = document.getElementById('fs-btn');
    fsBtn.addEventListener('click', async () => {
      try {
        if (vid.requestFullscreen) await vid.requestFullscreen();
        else if (vid.webkitRequestFullscreen) vid.webkitRequestFullscreen();
        else if (vid.mozRequestFullScreen) vid.mozRequestFullScreen();
        else if (vid.msRequestFullscreen) vid.msRequestFullscreen();
      } catch (e) { console.warn('Fullscreen failed', e); }
    });
    // When fullscreen is entered, ensure controls are visible
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) vid.controls = true;
    });
  </script>
  <script src="../js/lock.js"></script>
</body>
</html>
