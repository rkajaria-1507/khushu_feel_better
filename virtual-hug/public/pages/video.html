<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Video</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/lock.css">
  <style>
    body { font-family: Poppins, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; background:#000; color:#fff; }
  .video-wrapper { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:0 1rem; box-sizing:border-box; }
  .video-frame { width:min(100%,960px); aspect-ratio:16/9; background:#111; box-shadow:0 0 22px -4px rgba(255,255,255,0.35); border-radius:12px; overflow:hidden; }
  .video-frame iframe { width:100%; height:100%; border:0; }
  .controls { position:fixed; top:12px; left:12px; z-index:9999; display:flex; gap:.5rem; }
    .controls button, .controls a { margin-right:8px; padding:8px 12px; background:#fff; color:#111; border-radius:6px; text-decoration:none; border:none; cursor:pointer; }
  </style>
</head>
<body>
  <div class="controls">
    <a href="../index.html">← Back to Home</a>
  </div>
  <div class="video-wrapper">
    <div class="video-frame">
      <iframe 
        src="https://www.youtube.com/embed/86U8qnnjBPY?autoplay=1&rel=0"
        title="Special Video"
        frameborder="0"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen>
      </iframe>
    </div>
  </div>
  <script src="../js/lock.js"></script>
</body>
</html>
