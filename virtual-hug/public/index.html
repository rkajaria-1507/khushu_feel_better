<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Care Package</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/hearts.css">
  <link rel="stylesheet" href="css/flowers.css">
  <link rel="stylesheet" href="css/encouragement.css">
  <link rel="stylesheet" href="css/carousel.css">
  <link rel="stylesheet" href="css/loading.css">
  <link rel="stylesheet" href="css/lock.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Virtual Care Package 💖</h1>

    <!-- Theme music + video navigation -->
    <div class="theme-music-bar">
      <!-- Floating iframe injected on demand -->
      <button id="music-toggle-btn" class="music-btn">Play 🎵</button>
      <a class="music-btn" href="pages/video.html">Play Video ▶</a>
    </div>

    <!-- Love Timeline Box -->
    <div class="love-timeline">
      <h2>Our Love Timeline 💞</h2>
      <div class="love-timer" id="love-timer">Loading...</div>
    </div>

    <div class="links">
      <a href="pages/hug.html" class="card">Virtual Hug 🤗</a>
      <a href="pages/messages.html" class="card">Love Messages 💌</a>
      <div class="card encouragement-btn" onclick="showDailyEncouragement()">Why I Love You 💖</div>
      <!-- <a href="pages/activities.html" class="card">Date Ideas 💕</a> -->
      <a href="pages/flowers.html" class="card">Flowers for you 🌸</a>
    </div>
    
    <!-- Favourite Moments Carousel -->
    <div class="carousel-section">
      <h2 class="carousel-title">Our Favourite Moments 💫</h2>
      <div class="carousel-container">
        <div class="carousel-wrapper">
          <div class="carousel-track" id="carousel-track">
            <!-- Items injected dynamically -->
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Daily Encouragement Overlay (outside container so it doesn't fade) -->
  <div id="encouragement-overlay" class="encouragement-overlay hidden">
    <div class="encouragement-content">
      <div id="encouragement-message" class="encouragement-message"></div>
      <button class="close-btn" onclick="closeDailyEncouragement()">× Close</button>
      <button class="new-message-btn" onclick="showNewMessage()">New Message ✨</button>
    </div>
  </div>
  
  <!-- Flowers container (hidden by default, shown during encouragement) -->
  <div class="flowers-container"></div>
  
  <script>
    // Lightweight background YouTube music controller
    (function(){
      const YT_BG_URL = 'https://www.youtube.com/embed/DI15USCy_gw?autoplay=1&loop=1&playlist=DI15USCy_gw';
      const btn = document.getElementById('music-toggle-btn');
      let iframe = null;
      let playing = false;
      function createPlayer(){
        iframe = document.createElement('iframe');
        iframe.src = YT_BG_URL;
        iframe.width = 0; // hidden but audible
        iframe.height = 0;
        iframe.allow = 'autoplay; encrypted-media';
        iframe.style.position = 'absolute';
        iframe.style.left = '-9999px';
        iframe.setAttribute('title','Background music');
        document.body.appendChild(iframe);
      }
      btn.addEventListener('click', ()=>{
        if(!playing){
          if(!iframe) createPlayer();
          playing = true;
          btn.textContent = 'Pause 🎵';
          // Stopping requires replacing src (since we used a hidden simple embed)
        } else {
          if(iframe){
            iframe.parentNode.removeChild(iframe);
            iframe = null;
          }
          playing = false;
          btn.textContent = 'Play 🎵';
        }
      });
    })();
  </script>
  <script src="js/index.js"></script>
  <script src="js/hearts.js"></script>
  <script src="js/encouragement.js"></script>
  <script src="js/carousel.js"></script>
  <script src="js/lock.js"></script>
</body>
</html>
